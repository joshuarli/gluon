[package]
name = "meson"
version = "0.1.0"
edition = "2024"
description = "A Meson build system compatible implementation in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
glob = "0.3"
graph = { path = "../graph" }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
rustybench = { version = "0.1" }

[[bench]]
name = "meson"
harness = false
